<!DOCTYPE html>
<html>
<head>
    <title>Iris Flower Prediction</title>

    <link rel="stylesheet"
      href="{{ url_for('static',
      filename='style.css') }}">
</head>

<body>

    <h1>Iris Flower Classification</h1>

    <form action="/predict" method="post">

        <label>Sepal Length</label>
        <input type="text"
               name="sepal_length"
               required>

        <br><br>

        <label>Sepal Width</label>
        <input type="text"
               name="sepal_width"
               required>

        <br><br>

        <label>Petal Length</label>
        <input type="text"
               name="petal_length"
               required>

        <br><br>

        <label>Petal Width</label>
        <input type="text"
               name="petal_width"
               required>

        <br><br>

        <button type="submit">
            Predict
        </button>

    </form>

    {% if prediction %}

        <h2>
            Predicted Flower:
            {{ prediction }}
        </h2>

    {% endif %}

</body>
</html>
